name: Deploy HPWS Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hpws-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run project checks
        run: npm run check

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --name hpws

      - name: Publish Worker runtime secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEVICE_REGISTRATION_SECRET: ${{ secrets.DEVICE_REGISTRATION_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$DEVICE_REGISTRATION_SECRET"
          printf '%s' "$DEVICE_REGISTRATION_SECRET" | npx wrangler secret put DEVICE_REGISTRATION_SECRET --name hpws
