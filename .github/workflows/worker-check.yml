name: Worker Checks

on:
  push:
    branches:
      - ci/worker-security-checks
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Enforce npm security audit
        run: npm audit --audit-level=moderate

      - name: Report npm audit details
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range}),fixAvailable:v.fixAvailable})); console.log("TOTAL", JSON.stringify(a.metadata?.vulnerabilities||{}));'

      - name: Type-check test files
        run: npx tsc --project test

      - name: Run Worker functional tests
        run: npx vitest run

      - name: Run TypeScript and Wrangler dry-run checks
        run: npm run check
