name: Worker Checks

on:
  push:
    branches:
      - ci/worker-security-checks
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check test files
        run: npx tsc --project test

      - name: Run Worker functional tests
        run: npx vitest run

      - name: Run TypeScript and Wrangler dry-run checks
        run: npm run check

      - name: Enforce production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Report full dependency audit
        if: always()
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const audit = require("./npm-audit.json");
          const vulnerabilities = Object.entries(audit.vulnerabilities || {});
          console.log("Full dependency audit summary:", JSON.stringify(audit.metadata?.vulnerabilities || {}));
          for (const [name, vulnerability] of vulnerabilities) {
            console.log(JSON.stringify({
              name,
              severity: vulnerability.severity,
              isDirect: vulnerability.isDirect,
              range: vulnerability.range,
              via: vulnerability.via.map((item) =>
                typeof item === "string"
                  ? item
                  : { title: item.title, url: item.url, range: item.range }
              ),
              fixAvailable: vulnerability.fixAvailable
            }));
          }
          if (vulnerabilities.length > 0) {
            console.log("NOTICE: Full audit includes development-tool dependencies. Production dependencies are enforced by the blocking audit step.");
          }
          NODE
